[schedule]

create = """
INSERT INTO schedule_slots (worker_id, task_id, date, start_time, end_time, duration_units, status)
VALUES ($1, $2, $3, $4, $5, $6, $7)
RETURNING *;
"""

get_all = """
SELECT
    s.*,
    w.name       AS worker_name,
    w.role       AS worker_role,
    w.department AS worker_department,
    t.title      AS task_title,
    t.priority   AS task_priority,
    t.task_type  AS task_type
FROM schedule_slots s
JOIN workers w ON s.worker_id = w.id
LEFT JOIN tasks t ON s.task_id = t.id
ORDER BY s.date, s.start_time;
"""

get_by_worker = """
SELECT
    s.*,
    t.title     AS task_title,
    t.priority  AS task_priority,
    t.task_type AS task_type
FROM schedule_slots s
LEFT JOIN tasks t ON s.task_id = t.id
WHERE s.worker_id = $1
ORDER BY s.date, s.start_time;
"""

get_by_date = """
SELECT
    s.*,
    w.name       AS worker_name,
    w.role       AS worker_role,
    t.title      AS task_title,
    t.task_type  AS task_type
FROM schedule_slots s
JOIN workers w ON s.worker_id = w.id
LEFT JOIN tasks t ON s.task_id = t.id
WHERE s.date = $1
ORDER BY s.start_time, w.name;
"""

get_by_worker_and_date_range = """
SELECT
    s.*,
    t.title     AS task_title,
    t.task_type AS task_type
FROM schedule_slots s
LEFT JOIN tasks t ON s.task_id = t.id
WHERE s.worker_id = $1
  AND s.date BETWEEN $2 AND $3
ORDER BY s.date, s.start_time;
"""

delete = """
DELETE FROM schedule_slots WHERE id = $1 RETURNING *;
"""